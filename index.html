<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snow White - Landing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar container">
      <div class="nav-left">
        <img src="images/logo.png" alt="Disney logo" class="logo">
      </div>
      <ul class="nav-menu">
        <li><a href="#">DISNEY+</a></li>
        <li><a href="#">PARKS & TRAVEL</a></li>
        <li><a href="#">MOVIES</a></li>
        <li><a href="#">SHOP</a></li>
        <li><a href="#">MORE</a></li>
      </ul>
      <div class="nav-right">
        <a href="#" class="login">LOG IN</a>
        <input type="search" placeholder="Search" class="search">
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-overlay container">
        <h1 class="hero-title">Snow White</h1>
        <p class="hero-sub">Experience Snow White, now playing only in theaters!</p>
        <div class="hero-actions">
          <a href="#" class="btn btn--primary">Get Tickets Now</a>
          <a href="#" class="btn btn--secondary">Learn More</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <img src="images/logo-footer.png" alt="Disney logo" class="logo-footer">
      <ul class="footer-links">
        <li><a href="#">About Disney</a></li>
        <li><a href="#">Privacy Policy</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
    <p class="copyright">© 2025 Disney. All rights reserved.</p>
  </footer>
</body>
</html>
